<!doctype html> 
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" /> <!-- Meta tag que verifica o tamanho da tela para que as media queries funcionem corretamente -->
    <link rel="stylesheet" href="style.css" />
    <title>Login</title>
  </head>
  <body>
    <form action="#" method="post">
      <h1>Login</h1>
      <div> <!--Utilizei div neste ponto para possibilitar uma estilização mais ordenada e flexível dos elementos do formulário -->
        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" required />
      </div>
      <div>
        <label for="senha">Senha:</label>
        <input type="password" id="senha" name="senha" required />
      </div>
      <button type="submit" id="botao">Entrar</button>
      <div class="links">
        <a href="#">Cadastre-se</a>
        <a href="#">Esqueceu sua senha?</a>
      </div>
    </form>
    <script src="script.js"></script>
  </body>
</html>
